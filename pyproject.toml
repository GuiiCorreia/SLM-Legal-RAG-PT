[project]
name = "slm-legal-rag-pt"
version = "1.0.0"
description = "Small Language Models for Legal RAG in Portuguese: a 4x2 cross-domain evaluation (ENIAC 2026)"
requires-python = ">=3.10"
dependencies = [
    # PyTorch (CPU wheels by default; see [tool.uv.sources] for a CUDA index)
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.0.0",
    # LLM access (OpenAI-compatible APIs: DeepInfra, OpenRouter)
    "openai>=1.40.0",
    # Datasets
    "datasets>=2.20.0",
    # Data
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    # Evaluation
    "scipy>=1.11.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "protobuf>=4.25.0", # Required for BERTScore
    "scikit-learn>=1.4.0", # Cohen's kappa (inter-judge agreement)
    "pytrec-eval-terrier>=0.5.6", # TREC-style retrieval evaluation
    # Utils
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "evaluate>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]

[project.scripts]
run-experiments = "mestrado.experiments.run_all:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mestrado"]

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]

# PyTorch com CUDA 11.8 — compatível com driver 528.92 (CUDA 12.0 max)
# RTX 3050 4GB: fp16 + batch_size=32 usa ~1.5 GB VRAM (seguro)
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
